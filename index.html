<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Please log in to your account</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
        <span class="error" id="emailError"></span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" id="togglePassword" class="toggle" aria-label="Show password">Show</button>
        </div>
        <span class="error" id="passwordError"></span>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" name="remember"> Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <div id="formMessage" class="form-message" role="alert"></div>

      <button type="submit">Login</button>
    </form>

    <p class="signup">Don't have an account? <a href="#">Register</a></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
